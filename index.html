<style>
/* Layout: dark brand bar on top, a pipeline strip, then week-by-week cards or a month grid; a side drawer opens each post with its preview, both copies and the review actions. */
:root{
  --bg:#ededed; --surface:#ffffff; --surface-2:#e1e1e1; --fg:#212121; --muted:#5d5e55; --line:#d3d4cb;
  --brand:#212121; --brand-2:#383838; --lime:#ceff00; --on-lime:#212121; --accent-text:#4a5d00;
  --st-borrador:#8a8b82; --st-revision:#d48a00; --st-cambios:#d8432f; --st-aprobado:#6f8f00; --st-publicado:#3f6fd8;
  --shadow:0 1px 2px rgba(33,33,33,.06),0 8px 24px rgba(33,33,33,.06);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1b1b; --surface:#262626; --surface-2:#383838; --fg:#ededed; --muted:#a6a79d; --line:#3a3a3a;
  --accent-text:#ceff00; --st-borrador:#9a9b92; --st-revision:#f2b544; --st-cambios:#ff7a66; --st-aprobado:#ceff00; --st-publicado:#86a9ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1b1b; --surface:#262626; --surface-2:#383838; --fg:#ededed; --muted:#a6a79d; --line:#3a3a3a;
  --accent-text:#ceff00; --st-borrador:#9a9b92; --st-revision:#f2b544; --st-cambios:#ff7a66; --st-aprobado:#ceff00; --st-publicado:#86a9ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* Brand bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:#ededed;border-bottom:1px solid #000}
.topbar .inner{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.topbar img{height:26px;width:auto;display:block}
.topbar .sep{width:1px;height:22px;background:#4a4a4a}
.topbar h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#cfcfc6}
.topbar .grow{flex:1}
.role{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid #4a4a4a;color:#cfcfc6;white-space:nowrap}
.role b{color:var(--lime);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.lime{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.btn.lime:hover{filter:brightness(.95)}
.btn.dark{background:var(--brand);color:#ededed;border-color:var(--brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--st-cambios);border-color:color-mix(in srgb,var(--st-cambios) 45%,transparent);background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.topbar .btn.lime{border-color:var(--lime)}

/* Toolbar */
main{padding-block:22px 64px}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;font-weight:700}
.iconbtn:hover{border-color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#ededed}
.toolbar .grow{flex:1}

/* Pipeline strip */
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.stage{background:var(--surface);border:0;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.stage:hover{background:color-mix(in srgb,var(--surface) 92%,var(--fg))}
.stage .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stage .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:6px}
.stage .l i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stage[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--c)}
.stage[aria-pressed="true"] .n{color:var(--c)}
.scope-note{font-size:12px;color:var(--muted);margin:-12px 0 18px}
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--brand);color:#ededed;border-radius:var(--r);padding:12px 16px;margin-bottom:22px}
.alert strong{color:var(--lime)}
.alert .grow{flex:1;min-width:0}

/* Week list */
.week{margin-bottom:28px}
.week-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.week-h h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.week-h span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.thumb{aspect-ratio:4/5;max-height:260px;width:100%;background:var(--surface-2);position:relative;overflow:hidden;display:grid;place-items:center}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;text-align:center;padding:16px}
.thumb .ph .fmt-big{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--fg);opacity:.85}
.thumb .badges{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;justify-content:space-between;align-items:flex-start}
.thumb .count{position:absolute;right:10px;bottom:10px;background:rgba(33,33,33,.78);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.card-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card-b .when{font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.card-b h4{margin:0;font-size:15px;font-weight:700;line-height:1.3;text-wrap:balance}
.card-b p{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chans{display:flex;gap:4px}
.chan{font-size:10px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}

.fmt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--brand);color:var(--lime);border-radius:4px;padding:3px 7px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.thumb .pill{background:var(--surface)}

.week-h h3 i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px}
.date-tag{font-size:11px;font-weight:700;color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent-text) 40%,transparent);border-radius:4px;padding:1px 6px}

/* Empty / loading */
.state{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.state h3{color:var(--fg);margin:0 0 6px;font-size:17px}
.state p{margin:0 auto 14px;max-width:52ch}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(15,15,15,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:60;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.d-head .grow{flex:1;min-width:0}
.d-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.d-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted);font-weight:600}
.d-body{flex:1;overflow:auto;padding:20px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-content:start}
.d-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px}
.panel h3 .grow{flex:1}
.viewer{background:#111;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:4/5;max-height:62vh;display:grid;place-items:center;max-width:100%}
.viewer img,.viewer video{width:100%;height:100%;object-fit:contain;display:block}
.viewer .ph{color:#a6a79d;text-align:center;padding:24px;font-size:13px}
.viewer .ph b{display:block;color:#ededed;font-size:20px;margin-bottom:6px}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#212121;font-weight:800;font-size:16px}
.viewer .nav.p{left:10px}.viewer .nav.n{right:10px}
.viewer .idx{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-top:10px}
.strip .s{flex:0 0 56px;height:70px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2);position:relative}
.strip .s[aria-current="true"]{border-color:var(--lime)}
.strip .s img,.strip .s video{width:100%;height:100%;object-fit:cover}
.strip .s .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:11px;line-height:18px;padding:0}
.media-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -14px 12px;padding:0 14px}
.tabs button{border:0;background:transparent;padding:8px 10px 10px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--lime)}
.tabs .lang{font-size:10px;font-weight:700;color:var(--muted);margin-left:4px}
.copy{white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.6;max-width:68ch;margin:0}
.copy .lnk{color:var(--accent-text);font-weight:600}
.copy-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.copy-foot .cnt{font-size:12px;color:var(--muted)}
.copy-foot .cnt.over{color:var(--st-cambios);font-weight:700}
.copy-foot .grow{flex:1}
.empty-copy{color:var(--muted);font-style:italic}

.checks{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.checks div{display:flex;gap:8px;align-items:flex-start}
.checks i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--st-aprobado)}
.checks .warn i{background:var(--st-revision)}

.review{display:flex;flex-direction:column;gap:10px}
.review textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);resize:vertical}
.review .row{display:flex;gap:8px;flex-wrap:wrap}
.thread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.thread li{border-left:3px solid var(--c,var(--line));padding:2px 0 2px 10px}
.thread .who{font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thread .who img{width:18px;height:18px;border-radius:50%}
.thread .who time{font-weight:500;color:var(--muted)}
.thread .tx{font-size:13px;white-space:pre-wrap;margin-top:2px}

/* Edit form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:150px;resize:vertical;line-height:1.5}
.field .sub{font-size:11.5px;color:var(--muted)}
.checkrow{display:flex;gap:14px;flex-wrap:wrap;padding-top:6px}
.checkrow label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg)}
.d-foot{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.d-foot .grow{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--st-cambios)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--brand);color:#ededed;border:1px solid #444;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:80;opacity:0;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast b{color:var(--lime)}

@media (max-width:860px){
  .d-body{grid-template-columns:minmax(0,1fr)}
  .viewer{max-height:none}
}
@media (max-width:640px){
  .pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pipeline .stage:nth-child(n+4){grid-column:span 1}
  .monthnav h2{font-size:21px}
  .topbar .sep,.topbar h1{display:none}
  .form{grid-template-columns:minmax(0,1fr)}
  .d-head,.d-body,.d-foot{padding-left:16px;padding-right:16px}
  .cards{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const STATUSES=[
  {k:"borrador",l:"Borrador",c:"--st-borrador"},
  {k:"revision",l:"En revisión",c:"--st-revision"},
  {k:"cambios",l:"Cambios pedidos",c:"--st-cambios"},
  {k:"aprobado",l:"Aprobado",c:"--st-aprobado"},
  {k:"publicado",l:"Publicado",c:"--st-publicado"}];
const ST=Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const FORMATS=["Slider","Reel","Animación","Carrusel","Estático","Historia","Video"];
const LIMITS={ig:2200,li:3000};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{if(!s)return null;const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=new Date();today.setHours(0,0,0,0);
const fmtDay=new Intl.DateTimeFormat("es-AR",{weekday:"short",day:"numeric",month:"short"});
const fmtMonth=new Intl.DateTimeFormat("es-AR",{month:"long",year:"numeric"});
const fmtShort=new Intl.DateTimeFormat("es-AR",{day:"numeric",month:"short"});
const fmtStamp=new Intl.DateTimeFormat("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const mondayOf=d=>{const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x};
const newId=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const S={posts:[],loaded:false,err:null,slow:false,role:"read",uid:null,db:null,assets:null,user:null,
  status:"all",ch:"all",
  openId:null,editing:false,isNew:false,draft:null,tab:"ig",mi:0,confirmDel:false,busy:false,uploading:false};
const ORDER=["revision","cambios","aprobado","borrador","publicado"];
const GROUP_SUB={revision:"Esperan la revisión de gerencia",cambios:"Comms está ajustando",aprobado:"Listos para publicar",borrador:"En preparación",publicado:"Ya salieron"};

function toast(html){const t=$("#toast");t.innerHTML=html;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}
const canWrite=()=>S.role==="comms"||S.role==="review";
const isComms=()=>S.role==="comms";
/* Dated posts (the exception) first by date, then the rest, newest change first */
const postsSorted=()=>[...S.posts].sort((a,b)=>(a.date&&b.date)?a.date.localeCompare(b.date):a.date?-1:b.date?1:(b.updatedAt||"").localeCompare(a.updatedAt||""));
const chOk=p=>S.ch==="all"||(p.channels||[]).includes(S.ch);
const scoped=()=>postsSorted().filter(chOk);
const blob=id=>"/_blob/"+id;

function linkify(text){
  return esc(text).replace(/((?:https?:\/\/)?(?:[\w-]+\.)*glofy\.co(?:\/[\w\-\/?=&#.]*)?)/gi,'<span class="lnk">$1</span>');
}
function matrixChecks(p){
  const all=(p.copyEs||"")+"\n"+(p.copyEn||"");const out=[];
  const emoji=/\p{Extended_Pictographic}/u.test(all);
  out.push({ok:!emoji,t:emoji?"Tiene emojis. La Matriz 2026 no los usa.":"Sin emojis."});
  const q=/¿\s*sab[ií]as\s+que|did you know/i.test(all);
  out.push({ok:!q,t:q?"Abre con formato “¿Sabías que…?”. Pasalo a una afirmación.":"Sin aperturas del tipo “¿Sabías que…?”."});
  const cta=/glofy\.co/i.test(all);
  out.push({ok:cta,t:cta?"El CTA dirige a glofy.co.":"No hay CTA a glofy.co (jobs, checker o web)."});
  const both=(p.channels||[]).includes("ig")&&!p.copyEs||(p.channels||[]).includes("li")&&!p.copyEn;
  if(both)out.push({ok:false,t:"Falta el copy de uno de los canales marcados."});
  return out;
}

/* ---------- Render: board ---------- */
function render(){
  document.querySelectorAll("[data-ch]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ch===S.ch));
  const list=scoped();
  const counts=Object.fromEntries(STATUSES.map(s=>[s.k,list.filter(p=>p.status===s.k).length]));
  $("#pipeline").innerHTML=STATUSES.map(s=>`<button class="stage" style="--c:var(${s.c})" data-st="${s.k}" aria-pressed="${S.status===s.k}"><span class="l"><i></i>${s.l}</span><span class="n">${S.loaded?counts[s.k]:"–"}</span></button>`).join("");
  $("#scopeNote").textContent=S.loaded?`${list.length} ${list.length===1?"posteo":"posteos"}${S.ch!=="all"?` en ${S.ch==="ig"?"Instagram":"LinkedIn"}`:""}${S.status!=="all"?` · filtrando por “${ST[S.status].l}”, tocá de nuevo para quitar el filtro`:""}.`:"";
  const pend=counts.revision;
  $("#alert").innerHTML=S.loaded&&pend&&S.role==="review"&&S.status!=="revision"
    ?`<div class="alert"><span class="grow"><strong>${pend} ${pend===1?"posteo espera":"posteos esperan"} tu revisión.</strong></span><button class="btn lime sm" data-st="revision">Ver pendientes</button></div>`:"";
  const c=$("#content");
  if(S.err){c.innerHTML=`<div class="state"><h3>${esc(S.err.t)}</h3><p>${esc(S.err.d)}</p></div>`;return}
  if(!S.loaded){c.innerHTML=`<div class="state"><h3>Cargando el calendario…</h3><p>${S.slow?"Está tardando más de lo normal en conectar. Revisá tu conexión; la página sigue intentando.":"Trayendo los posteos programados."}</p></div>`;return}
  const shown=list.filter(p=>S.status==="all"||p.status===S.status);
  if(!S.posts.length){c.innerHTML=`<div class="state"><h3>Todavía no hay posteos cargados</h3><p>Cada posteo lleva fecha, formato, los copys de Instagram (ES) y LinkedIn (EN), el link a Drive y una vista previa.</p>${isComms()?'<button class="btn lime" data-act="new">+ Cargar el primero</button>':""}</div>`;return}
  if(!shown.length){c.innerHTML=`<div class="state"><h3>Nada para mostrar con estos filtros</h3><p>Probá otro canal o quitá el filtro de estado.</p></div>`;return}
  c.innerHTML=ORDER.map(k=>{
    const ps=shown.filter(p=>(ST[p.status]?p.status:"borrador")===k);if(!ps.length)return"";
    const s=ST[k];
    return `<section class="week"><div class="week-h"><h3 style="--c:var(${s.c})"><i></i>${s.l}</h3><span>${ps.length} ${ps.length===1?"posteo":"posteos"} · ${GROUP_SUB[k]}</span></div><div class="cards">${ps.map(cardHTML).join("")}</div></section>`;
  }).join("");
}
function mediaTag(m,cls=""){
  if(!m)return"";
  return m.type==="video"?`<video class="${cls}" src="${blob(m.id)}#t=0.5" muted playsinline preload="metadata"></video>`:`<img class="${cls}" src="${blob(m.id)}" alt="" loading="lazy">`;
}
function cardHTML(p){
  const st=ST[p.status]||ST.borrador;const m=(p.media||[])[0];
  const d=parse(p.date);
  const excerpt=(S.ch==="li"?p.copyEn:p.copyEs)||p.copyEn||p.copyEs||"";
  return `<button class="card" data-open="${esc(p.id)}">
    <div class="thumb">${m?mediaTag(m):`<div class="ph"><span class="fmt-big">${esc(p.format||"Posteo")}</span>${p.driveUrl?"Pieza en Drive, sin vista previa":"Sin pieza cargada"}</div>`}
      <div class="badges"><span class="fmt">${esc(p.format||"—")}</span><span class="pill" style="--c:var(${st.c})">${st.l}</span></div>
      ${(p.media||[]).length>1?`<span class="count">1 / ${p.media.length}</span>`:""}
    </div>
    <div class="card-b">
      <div class="when">${d?`<span class="date-tag">Sale el ${fmtDay.format(d)}</span>`:""}<span class="chans">${(p.channels||[]).map(c=>`<span class="chan">${c==="ig"?"IG":"IN"}</span>`).join("")}</span></div>
      <h4>${esc(p.title||"Sin título")}</h4>
      <p>${esc(excerpt)}</p>
    </div></button>`;
}

/* ---------- Drawer ---------- */
function openPost(id){S.openId=id;S.editing=false;S.isNew=false;S.mi=0;S.confirmDel=false;S.tab=S.ch==="li"?"li":"ig";try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}renderDrawer();showDrawer(true)}
function openNew(){
  const id=newId();
  S.openId=id;S.isNew=true;S.editing=true;S.confirmDel=false;S.mi=0;
  S.draft={id,title:"",date:"",time:"",format:"Reel",channels:["ig","li"],copyEs:"",copyEn:"",driveUrl:"",status:"borrador",media:[],feedback:[]};
  renderDrawer();showDrawer(true);setTimeout(()=>$("#f-title")?.focus(),250);
}
function closeDrawer(){S.openId=null;S.editing=false;S.draft=null;S.isNew=false;showDrawer(false);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
function showDrawer(on){$("#drawer").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);$("#drawer").setAttribute("aria-hidden",!on);document.body.style.overflow=on?"hidden":""}
const current=()=>S.isNew?S.draft:S.posts.find(p=>p.id===S.openId);

function renderDrawer(){
  const dr=$("#drawer");const p=S.editing?S.draft:current();
  if(!p){dr.innerHTML=S.openId&&S.loaded?`<div class="d-head"><div class="grow"><h2>Este posteo ya no existe</h2></div><button class="iconbtn" data-act="close" aria-label="Cerrar">✕</button></div>`:"";return}
  const st=ST[p.status]||ST.borrador;const d=parse(p.date);
  const head=`<div class="d-head"><div class="grow">
      <h2>${S.editing?(S.isNew?"Nuevo posteo":"Editando posteo"):esc(p.title||"Sin título")}</h2>
      <div class="meta"><span class="fmt">${esc(p.format||"—")}</span><span class="pill" style="--c:var(${st.c})">${st.l}</span>${d?`<span class="date-tag">Sale el ${fmtDay.format(d)}</span>`:""}</div>
    </div>
    ${!S.editing&&isComms()?`<button class="btn sm" data-act="edit">Editar</button>`:""}
    <button class="iconbtn" data-act="close" aria-label="Cerrar">✕</button></div>`;
  dr.innerHTML=head+`<div class="d-body"><div class="d-col">${mediaPanel(p)}</div><div class="d-col">${S.editing?formHTML(p):copyPanel(p)+reviewPanel(p)}</div></div>`+(S.editing?footHTML():"");
  resolveNames();
}
function mediaPanel(p){
  const ms=p.media||[];const i=Math.min(S.mi,Math.max(0,ms.length-1));const m=ms[i];
  const viewer=m?(m.type==="video"?`<video src="${blob(m.id)}" controls playsinline preload="metadata"></video>`:`<img src="${blob(m.id)}" alt="Vista previa ${i+1}">`)
    :`<div class="ph"><b>${esc(p.format||"Posteo")}</b>${p.driveUrl?"La pieza está en Drive. Abrila con el botón de abajo.":"Todavía no hay pieza cargada."}</div>`;
  const nav=ms.length>1?`<button class="nav p" data-act="mprev" aria-label="Anterior">‹</button><button class="nav n" data-act="mnext" aria-label="Siguiente">›</button><span class="idx">${i+1} / ${ms.length}</span>`:"";
  const strip=ms.length>1||(S.editing&&ms.length)?`<div class="strip">${ms.map((x,j)=>`<button class="s" data-mi="${j}" aria-current="${j===i}">${x.type==="video"?`<video src="${blob(x.id)}#t=0.5" muted preload="metadata"></video>`:`<img src="${blob(x.id)}" alt="">`}${S.editing?`<span class="x" data-rm="${j}" role="button" aria-label="Quitar">✕</span>`:""}</button>`).join("")}</div>`:"";
  const canUp=isComms()&&S.assets;
  const actions=`<div class="media-actions">
    ${p.driveUrl?`<a class="btn dark" href="${esc(p.driveUrl)}" target="_blank" rel="noopener">Abrir en Drive ↗</a>`:`<span class="btn" aria-disabled="true" style="opacity:.55;cursor:default">Sin link a Drive</span>`}
    ${canUp?`<button class="btn" data-act="upload" ${S.uploading?"disabled":""}>${S.uploading?"Subiendo…":(ms.length?"+ Agregar vista previa":"Subir vista previa")}</button>`:""}
  </div>
  ${canUp&&S.editing?`<p class="hint">Imágenes o video (MP4/WebM) de hasta 20 MB. Para sliders, subí cada placa en orden. La versión final sigue viviendo en Drive.</p>`:""}`;
  return `<div class="panel" style="padding:12px"><div class="viewer">${viewer}${nav}</div>${strip}${actions}</div>`;
}
function copyPanel(p){
  const ch=p.channels||[];
  const tabs=[["ig","Instagram","ES"],["li","LinkedIn","EN"]];
  const t=S.tab;const text=t==="ig"?p.copyEs:p.copyEn;const n=(text||"").length;
  const off=!ch.includes(t);
  const checks=matrixChecks(p);
  return `<div class="panel"><div class="tabs" role="tablist">${tabs.map(([k,l,lang])=>`<button role="tab" aria-selected="${t===k}" data-tab="${k}">${l}<span class="lang">${lang}</span></button>`).join("")}</div>
    ${off?`<p class="hint" style="margin:0 0 10px">Este posteo no está marcado para ${t==="ig"?"Instagram":"LinkedIn"}.</p>`:""}
    ${text?`<p class="copy">${linkify(text)}</p>`:`<p class="copy empty-copy">Sin copy para ${t==="ig"?"Instagram":"LinkedIn"}.</p>`}
    <div class="copy-foot"><span class="cnt mono ${n>LIMITS[t]?"over":""}">${n.toLocaleString("es-AR")} / ${LIMITS[t].toLocaleString("es-AR")} caracteres</span><span class="grow"></span>${text?`<button class="btn sm" data-act="copy">Copiar copy</button>`:""}</div></div>
    <div class="panel"><h3>Matriz de comunicación 2026</h3><div class="checks">${checks.map(c=>`<div class="${c.ok?"":"warn"}"><i></i><span>${esc(c.t)}</span></div>`).join("")}</div></div>`;
}
function reviewPanel(p){
  const fb=[...(p.feedback||[])].reverse();
  const kinds={aprobado:{l:"Aprobó",c:"--st-aprobado"},cambios:{l:"Pidió cambios",c:"--st-cambios"},nota:{l:"Comentó",c:"--st-borrador"},estado:{l:"Cambió el estado",c:"--st-publicado"}};
  const thread=fb.length?`<ul class="thread">${fb.map(f=>{const k=kinds[f.kind]||kinds.nota;return `<li style="--c:var(${k.c})"><div class="who"><img data-av="${esc(f.by||"")}" alt=""><span data-uid="${esc(f.by||"")}">Alguien</span><span style="font-weight:500;color:var(--muted)">${k.l}</span><time>${f.at?fmtStamp.format(new Date(f.at)):""}</time></div>${f.text?`<div class="tx">${esc(f.text)}</div>`:""}</li>`}).join("")}</ul>`:`<p class="hint" style="margin:0">Sin comentarios todavía.</p>`;
  let actions="";
  if(canWrite()){
    actions=`<div class="review"><label class="field" style="gap:5px"><span class="lbl" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">Comentario</span><textarea id="fbText" placeholder="Qué ajustar, o una nota para el equipo"></textarea></label>
      <div class="row">
        <button class="btn lime" data-act="approve" ${S.busy?"disabled":""}>Aprobar</button>
        <button class="btn danger" data-act="changes" ${S.busy?"disabled":""}>Pedir cambios</button>
        <button class="btn ghost" data-act="note" ${S.busy?"disabled":""}>Solo comentar</button>
      </div>
      ${isComms()?`<div class="row" style="align-items:center"><span class="hint" style="margin:0">Mover a:</span>${STATUSES.filter(s=>s.k!==p.status).map(s=>`<button class="btn sm" data-setst="${s.k}" ${S.busy?"disabled":""}>${s.l}</button>`).join("")}</div>`:""}
    </div>`;
  }else{
    actions=`<p class="hint" style="margin:0">Tenés acceso de lectura. Para aprobar o comentar, pedí acceso como Contributor.</p>`;
  }
  return `<div class="panel"><h3>Revisión</h3>${actions}</div><div class="panel"><h3>Historial</h3>${thread}</div>`;
}
function formHTML(p){
  return `<div class="panel"><div class="form">
    <div class="field full"><label for="f-title">Nombre interno</label><input id="f-title" value="${esc(p.title)}" placeholder="Ej.: Reel costo por token"></div>
    <div class="field"><label for="f-format">Formato</label><select id="f-format">${FORMATS.map(f=>`<option${f===p.format?" selected":""}>${f}</option>`).join("")}</select></div>
    <div class="field"><label for="f-status">Estado</label><select id="f-status">${STATUSES.map(s=>`<option value="${s.k}"${s.k===p.status?" selected":""}>${s.l}</option>`).join("")}</select></div>
    <div class="field full"><span class="lbl">Canales</span><div class="checkrow"><label><input type="checkbox" id="f-ig" ${(p.channels||[]).includes("ig")?"checked":""}> Instagram</label><label><input type="checkbox" id="f-li" ${(p.channels||[]).includes("li")?"checked":""}> LinkedIn</label></div></div>
    <div class="field full"><label for="f-date">Fecha de salida (opcional)</label><input id="f-date" type="date" value="${esc(p.date)}" style="max-width:220px"><span class="sub">Completala solo si el posteo tiene que salir un día puntual.</span></div>
    <div class="field full"><label for="f-drive">Link a Drive</label><input id="f-drive" type="url" value="${esc(p.driveUrl)}" placeholder="https://drive.google.com/…"><span class="sub">Carpeta o archivo final de la pieza.</span></div>
    <div class="field full"><label for="f-es">Copy Instagram · ES</label><textarea id="f-es">${esc(p.copyEs)}</textarea><span class="sub mono" id="c-es"></span></div>
    <div class="field full"><label for="f-en">Copy LinkedIn · EN</label><textarea id="f-en">${esc(p.copyEn)}</textarea><span class="sub mono" id="c-en"></span></div>
  </div></div>`;
}
function footHTML(){
  return `<div class="d-foot">${!S.isNew?(S.confirmDel?`<span class="confirm">¿Eliminar este posteo? <button class="btn danger sm" data-act="delyes">Eliminar</button><button class="btn sm" data-act="delno">No</button></span>`:`<button class="btn danger sm" data-act="del">Eliminar</button>`):""}
    <span class="grow"></span><button class="btn ghost" data-act="cancel">Cancelar</button><button class="btn lime" data-act="save" ${S.busy?"disabled":""}>${S.isNew?"Crear posteo":"Guardar cambios"}</button></div>`;
}
function readForm(){
  const d=S.draft;if(!d||!$("#f-title"))return d;
  d.title=$("#f-title").value.trim();d.date=$("#f-date").value;d.format=$("#f-format").value;d.status=$("#f-status").value;
  d.channels=[$("#f-ig").checked&&"ig",$("#f-li").checked&&"li"].filter(Boolean);d.driveUrl=$("#f-drive").value.trim();d.copyEs=$("#f-es").value;d.copyEn=$("#f-en").value;
  return d;
}
function updCounters(){[["es","ig"],["en","li"]].forEach(([f,k])=>{const el=$("#c-"+f),ta=$("#f-"+f);if(el&&ta){const n=ta.value.length;el.textContent=`${n.toLocaleString("es-AR")} / ${LIMITS[k].toLocaleString("es-AR")} caracteres`;el.style.color=n>LIMITS[k]?"var(--st-cambios)":""}})}

async function resolveNames(){
  if(!S.user)return;const els=[...document.querySelectorAll("[data-uid]")];const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];if(!ids.length)return;
  const ps=await S.user.profiles(ids);
  els.forEach(e=>{const p=ps[e.dataset.uid];if(p)e.textContent=p.isMe?"Vos":(p.name||"Alguien")});
  document.querySelectorAll("img[data-av]").forEach(e=>{const p=ps[e.dataset.av];if(p)e.src=p.avatarUrl});
}

/* ---------- Writes ---------- */
const ref=id=>S.db.collection("posts").doc(id);
async function save(){
  const d=readForm();if(!d)return;
  if(!d.title){toast("Poné un <b>nombre interno</b> para identificar el posteo.");$("#f-title")?.focus();return}
  S.busy=true;renderDrawerFoot();
  const body={title:d.title,date:d.date||"",time:d.time||"",format:d.format,channels:d.channels,copyEs:d.copyEs,copyEn:d.copyEn,driveUrl:d.driveUrl,status:d.status,media:d.media||[],feedback:d.feedback||[],updatedAt:new Date().toISOString(),updatedBy:S.uid};
  if(S.isNew){body.createdAt=body.updatedAt;body.createdBy=S.uid}
  try{
    if(S.isNew)await ref(d.id).set(body);else await ref(d.id).update(body);
    toast(S.isNew?"Posteo <b>creado</b>":"Cambios <b>guardados</b>");
    S.isNew=false;S.editing=false;S.draft=null;
  }catch(e){toast(writeErr(e))}
  S.busy=false;render();renderDrawer();
}
function renderDrawerFoot(){const f=document.querySelector(".d-foot");if(f)f.outerHTML=footHTML()}
function writeErr(e){
  if(e&&e.code==="invalid_argument")return"No tenés permiso para guardar cambios acá.";
  if(e&&e.code==="quota_exceeded")return"Se llenó el espacio del calendario. Eliminá posteos viejos.";
  return"No se pudo guardar. Probá de nuevo en unos segundos.";
}
async function addFeedback(kind,newStatus){
  const p=current();if(!p)return;const text=($("#fbText")?.value||"").trim();
  if(kind==="cambios"&&!text){toast("Contá <b>qué cambiar</b> en el comentario.");$("#fbText")?.focus();return}
  if(kind==="nota"&&!text){$("#fbText")?.focus();return}
  S.busy=true;renderDrawer();
  const entry={kind,by:S.uid,at:new Date().toISOString(),text};
  if(kind==="estado")entry.text=`→ ${ST[newStatus].l}`;
  const upd={feedback:[...(p.feedback||[]),entry],updatedAt:entry.at,updatedBy:S.uid};
  if(newStatus)upd.status=newStatus;
  try{await ref(p.id).update(upd);toast(kind==="aprobado"?"Posteo <b>aprobado</b>":kind==="cambios"?"Pedido de cambios <b>enviado</b>":kind==="estado"?`Movido a <b>${ST[newStatus].l}</b>`:"Comentario <b>agregado</b>")}catch(e){toast(writeErr(e))}
  S.busy=false;renderDrawer();
}
async function delPost(){
  const p=current();if(!p)return;S.busy=true;
  try{
    await ref(p.id).delete();
    if(S.assets)for(const m of p.media||[]){try{await S.assets.delete(m.id)}catch(e){}}
    toast("Posteo <b>eliminado</b>");closeDrawer();
  }catch(e){toast(writeErr(e))}
  S.busy=false;
}
async function uploadFiles(files){
  if(!S.assets||!files.length)return;
  if(!S.editing){const p=current();if(!p)return;S.draft=JSON.parse(JSON.stringify(p));S.editing=true}
  else readForm();
  S.uploading=true;renderDrawer();
  for(const f of files){
    try{const r=await S.assets.upload(f);S.draft.media=[...(S.draft.media||[]),{id:r.id,type:r.contentType.startsWith("video")?"video":"image"}];S.mi=S.draft.media.length-1}
    catch(e){toast(e?.code==="too_large"?`“${esc(f.name)}” pesa más de 20 MB. Comprimilo o dejá solo el link a Drive.`:e?.code==="unsupported_type"?`“${esc(f.name)}” no es un formato admitido (PNG, JPG, WebP, GIF, MP4, WebM).`:`No se pudo subir “${esc(f.name)}”.`)}
  }
  S.uploading=false;renderDrawer();
  toast("Vista previa cargada. <b>Guardá</b> para confirmar.");
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-rm],[data-open]");if(!t)return;
  if(t.dataset.rm!==undefined&&S.editing){e.stopPropagation();readForm();const j=+t.dataset.rm;const [m]=S.draft.media.splice(j,1);S.draft._removed=[...(S.draft._removed||[]),m];S.mi=0;renderDrawer();return}
  if(t.dataset.open){openPost(t.dataset.open);return}
  if(t.dataset.st){S.status=S.status===t.dataset.st?"all":t.dataset.st;render();return}
  if(t.dataset.ch){S.ch=t.dataset.ch;render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;renderDrawer();return}
  if(t.dataset.mi!==undefined){if(S.editing)readForm();S.mi=+t.dataset.mi;renderDrawer();return}
  if(t.dataset.setst){addFeedback("estado",t.dataset.setst);return}
  const a=t.dataset.act;if(!a)return;
  const p=S.editing?S.draft:current();
  switch(a){
    case"new":openNew();break;
    case"close":closeDrawer();break;
    case"edit":S.draft=JSON.parse(JSON.stringify(current()));S.editing=true;renderDrawer();updCounters();break;
    case"cancel":if(S.isNew){if(S.assets)(S.draft.media||[]).forEach(m=>S.assets.delete(m.id).catch(()=>{}));closeDrawer()}else{S.editing=false;S.draft=null;S.confirmDel=false;renderDrawer()}break;
    case"save":{const rm=S.draft?._removed||[];if(S.draft)delete S.draft._removed;save().then(()=>{if(S.assets&&!S.editing)rm.forEach(m=>S.assets.delete(m.id).catch(()=>{}))});break}
    case"del":S.confirmDel=true;renderDrawerFoot();break;
    case"delno":S.confirmDel=false;renderDrawerFoot();break;
    case"delyes":delPost();break;
    case"upload":$("#fileIn").click();break;
    case"mprev":if(S.editing)readForm();S.mi=(S.mi-1+p.media.length)%p.media.length;renderDrawer();break;
    case"mnext":if(S.editing)readForm();S.mi=(S.mi+1)%p.media.length;renderDrawer();break;
    case"approve":addFeedback("aprobado","aprobado");break;
    case"changes":addFeedback("cambios","cambios");break;
    case"note":addFeedback("nota");break;
    case"copy":{const txt=S.tab==="ig"?p.copyEs:p.copyEn;navigator.clipboard.writeText(txt).then(()=>toast("Copy <b>copiado</b>")).catch(()=>{const el=document.querySelector(".copy");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto seleccionado. Copialo con Ctrl/Cmd + C.")});break}
  }
});
$("#newBtn").addEventListener("click",openNew);
$("#scrim").addEventListener("click",()=>{if(!S.editing)closeDrawer()});
$("#fileIn").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";uploadFiles(f)});
document.addEventListener("input",e=>{if(e.target.id==="f-es"||e.target.id==="f-en")updCounters()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.openId&&!S.editing)closeDrawer()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.openId&&S.posts.some(p=>p.id===h))openPost(h)});

/* ---------- Boot ---------- */
render();
(async()=>{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db;S.user=user;
  if(!db){S.err={t:"No se pudo abrir el calendario",d:"Iniciá sesión en Claude con tu cuenta de Glofy para ver y revisar los posteos."};$("#role").textContent="Sin acceso";render();return}
  S.uid=user?await user.id():null;
  const [edit,w]=user?await Promise.all([user.canEdit(),user.can("data.write")]):[false,null];
  S.role=edit?"comms":(w===false?"read":"review");
  if(S.role==="comms"){S.assets=await claude.use("assets")}
  $("#role").innerHTML=S.role==="comms"?"Modo <b>Comms</b> · edición":S.role==="review"?"Modo <b>Gerencia</b> · revisión":"Solo lectura";
  $("#newBtn").hidden=!isComms();
  const timer=setTimeout(()=>{S.slow=true;render()},10000);
  db.collection("posts").onSnapshot(snap=>{
    S.posts=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){clearTimeout(timer);S.slow=false}
    const first=!S.loaded;S.loaded=true;render();
    if(S.openId&&!S.editing)renderDrawer();
    if(first){const h=location.hash.slice(1);if(h&&S.posts.some(p=>p.id===h))openPost(h)}
  },err=>{clearTimeout(timer);S.err={t:"Se cortó la conexión con el calendario",d:"Recargá la página para volver a conectarte."};render()});
})();
</script>
